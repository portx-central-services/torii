<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PortX · Delivery Dashboard</title>

  <link rel="stylesheet" href="../colors_and_type.css" />
  <link rel="stylesheet" href="styles.css" />

  <!-- Tweak hooks: density + accent treatment overrides -->
  <style>
    /* Compact density */
    html[data-density="compact"] .tbl tbody td { padding: 7px 12px; font-size: 12.5px; }
    html[data-density="compact"] .tbl thead th { padding: 8px 12px; }
    html[data-density="compact"] .kpi-value { font-size: 24px; }
    html[data-density="compact"] .kpi { padding: 11px 14px; }
    html[data-density="compact"] .page { gap: 14px; }

    /* Restrained: drop the gradient bars and pill dots in favor of neutral */
    html[data-accent="restrained"] .page-header h1::after,
    html[data-accent="restrained"] .detail-hero::before {
      background: var(--ink-900);
    }
    html[data-accent="restrained"] .bar > span,
    html[data-accent="restrained"] .phase-pill .dot,
    html[data-accent="restrained"] .gantt-bar.active {
      background: var(--ink-900);
      color: var(--paper);
    }
    html[data-accent="restrained"] .sidebar-nav-item.active {
      background: var(--paper);
      color: var(--ink-1000);
    }
    html[data-accent="restrained"] .cap-status-healthy > span {
      background: var(--ink-900);
    }
    html[data-accent="restrained"] .kpi.accent::before {
      background: var(--ink-900);
    }
    html[data-accent="restrained"] .btn-primary {
      background: var(--ink-1000);
      color: var(--paper);
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Data first -->
  <script src="data.js"></script>

  <!-- Tweaks panel -->
  <script type="text/babel" src="../tweaks-panel.jsx"></script>

  <!-- Components -->
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="projects-view.jsx"></script>
  <script type="text/babel" src="project-detail.jsx"></script>
  <script type="text/babel" src="capacity-view.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
