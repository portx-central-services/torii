<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Headings — Space Grotesk</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { background: var(--paper); margin: 0; }
  .wrap { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: baseline; gap: 18px; }
  .meta {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--fg-subtle);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    white-space: nowrap;
    min-width: 110px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="row"><span class="meta">h1 · 32 / 800</span><h1>Customer 360, governed in real time</h1></div>
    <div class="row"><span class="meta">h2 · 24 / 700</span><h2>Integration Manager onboarding</h2></div>
    <div class="row"><span class="meta">h3 · 20 / 600</span><h3>FedNow connector — ready for production</h3></div>
    <div class="row"><span class="meta">h4 · 17 / 600</span><h4>What changed in this release</h4></div>
  </div>
</body>
</html>
